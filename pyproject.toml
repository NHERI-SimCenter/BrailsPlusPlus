    "tests/scrapers/conftest.py",
    "tests/scrapers/test_nsi_parser.py",
    "tests/scrapers/test_nsi_file_reader.py",
    "tests/scrapers/data/nsi_fixture_generator.py",
    "tests/scrapers/data/nsi_pooled_fixture_generator.py",

    "tests/scrapers/test_overture_release_resolution.py",
    "tests/scrapers/test_overture_local_path.py",

