    "tests/scrapers/test_census_tract_scraper.py",
    "brails/utils/census_api_key.py",
    "tests/utils/test_census_api_key.py",
    "brails/scrapers/us_census_scrapers/acs_table_scraper.py",
    "tests/scrapers/test_acs_table_scraper.py",
    "brails/types/geometry_region.py",
    "tests/types/test_geometry_region.py",
    "brails/scrapers/us_census_scrapers/tiger_line_scraper.py",
    "tests/scrapers/test_tiger_line_scraper.py",
    "brails/scrapers/mobile_home_park_scraper/mobile_home_park_scraper.py",
