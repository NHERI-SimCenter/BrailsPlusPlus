[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brails"
dynamic = ["version"]
description = "BRAILS++: Building Regional Asset Inventories for Large Scale Simulation"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
  { name = "NHERI SimCenter", email = "nheri-simcenter@berkeley.edu" }
]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10,<3.13"
classifiers = [
    "Programming Language :: Python",
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Environment :: Console",
    "Framework :: Jupyter",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "addict",
    "Cython",
    "ftfy",
    "jsonschema",
    "matplotlib",
    "opencv-python",
    "geopandas~=1.0",
    "pandas",
    "pillow",
    "plotly",
    "pycocotools",
    "pyarrow",
    "rasterio",
    "reverse-geocode",
    "requests",
    "scikit-learn",
    "scipy",
    "seaborn",
    "shapely",
    "simcenter-dlml>=3.1,<4",
    "simcenter-pyncoda-fork==3.0.0.post2",
    "supervision",
    "numpy",
    "timm",
    "tensorboard",
    "tensorboardX",
    "torch<=2.5.0",
    "torchvision<=0.20.0",
    "torchaudio<=2.5.0",
    "transformers",
    "wget",
    "yacs",
    "webcolors",
    "yapf"
]

[project.optional-dependencies]
development = [
    "flake8",
    "pylint",
    "black",
    "ruff==0.12.10",
    "codespell",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "jupyter",
    "jupytext",
    "sphinx",
    "sphinx-autoapi",
    "nbsphinx",
    "flake8-rst",
    "flake8-rst-docstrings",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
brails = [
    "py.typed",
    "processors/vlm_image_classifier/clip/bpe_simple_vocab_16e6.txt.gz",
    "processors/foundation_classifier/csail_segmentation_tool/csail_seg/data/color150.mat",
    "processors/foundation_classifier/csail_segmentation_tool/csail_seg/config/*.yaml",
    "aggregators/housing_units/pyncoda/supporting_data/*.json",
    "aggregators/stacked_footprints/README.rst",
    "inferers/hazus_inferer_wind/input_schema.json",
    "inferers/stories_from_height_inferer/height_scales.json",
    "inferers/stories_from_height_inferer/README.rst",
    "inferers/acs_unit_budget/README.rst",
    "inferers/acs_year_built_sampler/README.rst",
    "inferers/README.rst",
    "imputers/residential_neighbor_year_sampler/README.rst",
    "imputers/replacement_cost/README.rst",
    "imputers/observed_donor_imputer/README.rst",
    "imputers/README.rst",
    "inferers/hazus_inferer_earthquake/README.rst",
    "compilers/README.rst",
    "compilers/hazus_earthquake/README.rst",
    "scrapers/overture_maps_scraper/README.rst",
    "scrapers/nsi_parser/README.rst"
    
]

[tool.ruff]
target-version = "py39"
line-length = 85
include = [
    #"brails/types/asset_inventory.py",

    "brails/types/housing_unit_inventory.py",
    "tests/types/test_housing_unit_inventory.py",
    "tests/types/test_asset_inventory_possible_worlds.py",
    "tests/types/test_asset_inventory_add_world.py",
    "tests/types/test_inventory_merge.py",
    "tests/types/test_integer_id_export.py",
    "tests/types/test_geojson_n_worlds.py",
    "brails/types/census_boundary.py",
    "tests/types/test_census_boundary.py",
    "tests/types/test_asset_inventory_geometry.py",
    "tests/utils/test_input_validator.py",
    "tests/conftest.py",
    "tests/local_files.py",

    "brails/aggregators/points_to_polygons/basic/basic_points_to_polygons.py",
    "tests/aggregators/points_to_polygons/basic/test_basic_points_to_polygons.py",
    "brails/aggregators/points_to_polygons/nsi_footprint_join.py",
    "tests/aggregators/points_to_polygons/test_nsi_footprint_join.py",
    "brails/aggregators/stacked_footprints/stacked_footprints.py",
    "tests/aggregators/stacked_footprints/test_stacked_footprints.py",

    "brails/aggregators/housing_units/pyncoda/pyncoda_housing_units.py",
    "brails/aggregators/housing_units/pyncoda/supporting_data/FIPS_lookup_generator.py",
    "tests/aggregators/housing_units/pyncoda/test_pyncoda_housing_units.py",

