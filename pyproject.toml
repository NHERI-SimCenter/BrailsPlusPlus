    "tests/utils/test_inventory_union.py",
    "tests/utils/test_unit_count_rules.py",

    "brails/validators/**/*.py",
    "tests/validators/**/*.py",

    "brails/fixers/**/*.py",
    "tests/fixers/**/*.py",

    "brails/compilers/**/*.py",
    "tests/compilers/**/*.py",
]

[tool.ruff.lint]
# Enable all known categories
select = ["ALL"]
ignore = [
  "D211",
  "D212",
  "Q000",
  "Q003",
  "COM812",
  "D203",
  "ISC001",
  "E501",
  "ERA001",
  "PGH003",
  "FIX002",
  "TD003",
  "S101",
  "N801",
  "S311",
  "G004",
  "SIM102",
  "SIM108",
  "NPY002",
  "F401",
  "TRY003",
  "EM101",
  "EM102",
  "UP007",
  "UP006",
  "UP045",
  "T201",
  "N999"
]

[tool.ruff.lint.per-file-ignores]
    "tests/*" = [
        "ANN401",
        "SLF001",
        "PLR2004"
    ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args=15
max-locals=50
max-returns=11
max-branches=50
max-statements=150
max-bool-expr=5

[tool.ruff.format]
quote-style = "single"

[tool.codespell]
skip = [
    "*.html",
    "*.csv",
    "*.rst",
    "*.ipynb",
    "./htmlcov/*",
    "./docs/*",
    "./examples/*",
    "./external_tools/*",
    "./tests/utils/*",
    "./brails/inferers/*",
    "./brails/imputers/*",
    "./brails/processors/*",
    "./brails/filters/*",
    "./brails/utils/*",
    "./brails/scrapers/asce_hazard_data_scraper/*",
    "./brails/scrapers/fema_firm_scraper/*",
    "./brails/scrapers/google_satellite/*",
    "./brails/scrapers/google_streetview/*",
    "./brails/scrapers/ms_footprint_scraper/*",
    "./brails/scrapers/nbi_scraper/*",
    "./brails/scrapers/nsi_parser/*",
    "./brails/scrapers/nti_scraper/*",
    "./brails/scrapers/osm_footprint_scraper/*",
    "./brails/scrapers/osm_power_network_scraper/*",
    "./brails/scrapers/overture_maps_scraper/*",
    "./brails/scrapers/us_census_scrapers/*",
    "./brails/scrapers/usa_footprint_scraper/*",
    "./brails/scrapers/usgs_data_scrapers/*",
    "./brails/aggregators/housing_units/pyncoda/supporting_data/fips_lookup.json",
    "./brails/aggregators/housing_units/pyncoda/supporting_data/state_abbreviations.json"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: marks tests that make real network calls (deselect with 'not live')"
]
