    "brails/inferers/acs_unit_budget/acs_unit_budget.py",
    "brails/inferers/stories_from_height_inferer/stories_from_height_inferer.py",
    "tests/inferers/**/*.py",

    "brails/utils/deterministic_sampling.py",
    "tests/utils/test_deterministic_sampling.py",
    "brails/utils/stage_freeze.py",
    "tests/utils/test_stage_freeze.py",

    "brails/utils/asset_id.py",
    "tests/utils/test_asset_id.py",
    "brails/utils/region_filter.py",
    "tests/utils/test_region_filter.py",
    "brails/utils/console.py",
    "brails/utils/http_session.py",
    "tests/utils/test_http_session.py",
    "brails/utils/tiger_files.py",
    "tests/utils/test_tiger_files.py",
    "tests/scrapers/test_footprint_asset_ids.py",
